[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "pr-job-matcher"
version = "2.0.0"
description = "Always-on PR-to-Job Matcher & Toxic-Company Filter with Dual-Axis scoring, SimHash repost churn detection, and secret-scrubbing ingestion."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Backend Engineering Automation" }
]
keywords = ["job-matcher", "github-pr", "career-automation", "llm", "scraper"]
dependencies = [
  "pydantic>=2.7.0,<3.0.0",
  "pydantic-settings>=2.2.0,<3.0.0",
  "sqlalchemy>=2.0.30,<3.0.0",
  "httpx>=0.27.0,<1.0.0",
  "typer>=0.12.3,<1.0.0",
  "rich>=13.7.1,<14.0.0",
]

[project.optional-dependencies]
scraping = [
  "beautifulsoup4>=4.12.3,<5.0.0",
  "playwright>=1.44.0,<2.0.0",
]
dev = [
  "pytest>=8.2.0,<9.0.0",
  "pytest-cov>=5.0.0,<6.0.0",
  "ruff>=0.4.4,<1.0.0",
  "mypy>=1.10.0,<2.0.0",
]

[project.scripts]
pr-job-matcher = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
